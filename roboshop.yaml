- name: Create ec2 instance and route53 records
  hosts: local
  connection: local
  vars: 
    instances: ["mongodb", "redis", "mysql", "rabbitmq"]
    action: create
    domain_name: saipavan.store
    ami_id: ami-0055977a6e828a4f4
  tasks:
  - name: create ec2_instance
    amazon.aws.ec2_instance:
      name: "roboshop-{{ item }}"
      image_id: "{{ ami_id }}"
      instance_type: "t3.micro"
      security_groups:
       - "roboshop-common"
       - "roboshop-{{ item }}"
      region: "us-east-1"
    loop: "{{ instances }}"  
    when: action == "create"
    register: "ec2_output"

  - name: Print ec2 creation output
    debug:
      msg: "{{ ec2-output }}"

  - name: creating r53 records
    amazon.aws.route53:
     state: present
     zone: "{{ domain_name }}"
     record: "{{ item.item }}.{{ domain_name }}"
     type: A
     ttl: 1
     value: "{{ item.instances[0],private_ip_adress }}"
     overwrite: true
    loop: "{{ ec2-output.results }}"    
    when: action == "create"

  - name: deleting r53 record
    amazon.aws.route53:
     state: absent
     zone: "{{ domain_name }}"
     record: "{{ item }}.{{ domain_name }}"
     type: A
     ttl: 1
    loop: "{{ instances }}"
    when: action == "delete"

  - name: delete ec2 instances
    amazon.aws.ec2_instance:
     state: absent
     name: "roboshop-{{ item }}"
     region: us-east-1
     wait: false
    loop: "{{ instances }}" 
    when: action == "delete"