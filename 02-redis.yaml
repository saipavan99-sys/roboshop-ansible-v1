- name: configure redis server
  hosts: redis
  connection: local
  tasks:
  - name: enable redi 7
    command: dnf module enable redis:7 -y

  - name: install redis
    package:
      name: redis
      state: present

  - name: Allow remort connections
    replace:
      path: /etc/redis/redis.conf
      regexp: '127.0.0.1'
      replace: '0.0.0.0'
        

