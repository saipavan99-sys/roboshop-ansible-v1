- name: Create ec2 instance and route53 records
  hosts: local
  connection: local
  vars: 
    instances: ["mongodb", "redis", "mysql", "rabbitmq"]
    action: create
    domain_name: saipavan.store
    ami_id: ami-0055977a6e828a4f4
  tasks:
  - name: create ec2_instance
    amazon.aws.ec2_instance:
      name: "roboshop-{{ item }}"
      image_id: "{{ ami_id }}"
      instance_type: "t3.micro"
      security_group:
       - roboshop-common
       - "roboshop-{{ item }}"
      region: "us-east-1"
    loop: "{{ instances }}"  
    when: action == "create"